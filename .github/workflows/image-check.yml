name: Check optimized images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
  pull_request:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install image optimization tools
        run: python -m pip install -r scripts/requirements-dev.txt

      - name: Check images are optimized
        run: python scripts/optimize_images.py --check --all
