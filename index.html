<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.jsdelivr.net/npm/marked@18.3.0/lib/marked.umd.js"></script>
    <title>AI Dev Notes</title>
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-synthesis: none;
            --bg: #f6f7f8;
            --surface: #ffffff;
            --line: #e8eaed;
            --line-soft: #f0f1f2;
            --text: #2f3236;
            --text-2: #666c73;
            --text-3: #8a9097;
            --accent: #c9433b;
            --accent-soft: #fbf1f0;
        }
        * { box-sizing: border-box; }
        body { height: 100vh; min-width: 1024px; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
        button, input { font: inherit; }
        a { color: inherit; }
        .topbar { height: 56px; display: flex; align-items: center; gap: 28px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 8px; min-width: 200px; color: var(--text); font-size: 16px; font-weight: 600; }
        .brand-icon { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 6px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
        .search { width: min(420px, 42vw); height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 8px; color: var(--text-3); }
        .search svg { flex: none; }
        .search input { width: 100%; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
        .search:focus-within { border-color: var(--accent); background: var(--surface); }
        .top-actions { margin-left: auto; color: var(--text-2); font-size: 13px; }
        .top-actions a { text-decoration: none; }
        .workspace { height: calc(100vh - 56px); display: grid; grid-template-columns: 220px 300px minmax(360px, 1fr); }
        .sidebar { display: flex; flex-direction: column; min-height: 0; padding: 16px 12px; background: var(--bg); border-right: 1px solid var(--line); }
        .section-label { padding: 8px 12px; color: var(--text-3); font-size: 12px; }
        #group-list { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
        .side-link { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; color: var(--text-2); font-size: 13px; text-decoration: none; cursor: pointer; }
        .side-link:hover, .side-link.active { color: var(--accent); background: var(--accent-soft); }
        .side-icon { flex: none; width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-3); }
        .side-icon svg { display: block; width: 16px; height: 16px; }
        .side-link.active .side-icon { color: var(--accent); }
        .group-count { margin-left: auto; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
        .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }
        .note-list-pane { min-width: 0; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
        .list-heading { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--line); }
        .list-heading strong { font-size: 14px; font-weight: 600; }
        .list-heading small { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
        .note-list { height: calc(100% - 56px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d3d6da transparent; }
        .note-list::-webkit-scrollbar { width: 8px; }
        .note-list::-webkit-scrollbar-thumb { border-radius: 8px; background: #d3d6da; }
        .note-list::-webkit-scrollbar-thumb:hover { background: #b9bec4; }
        .note-list::-webkit-scrollbar-track { background: transparent; }
        .note-item { display: block; min-height: 88px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); color: inherit; text-decoration: none; cursor: pointer; }
        .note-item:hover { background: var(--bg); }
        .note-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
        .note-title { overflow: hidden; margin-bottom: 8px; color: var(--text); font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
        .note-meta { color: var(--text-3); font-size: 12px; }
        .note-path { display: block; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
        .reader { min-width: 0; overflow: auto; background: var(--surface); }
        .reader-toolbar { position: sticky; z-index: 1; top: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--text-3); font-size: 12px; }
        .toolbar-buttons { display: flex; gap: 16px; }
        .reader-body { width: min(100% - 64px, 760px); margin: 0 auto; padding: 0px 0 96px; line-height: 1.85; overflow-wrap: anywhere; }
        .reader-body article { color: var(--text); font-size: 15px; }
        .reader-body article h1, .reader-body article h2, .reader-body article h3 { margin: 28px 0 12px; color: var(--text); font-weight: 600; line-height: 1.35; }
        .reader-body article h1 { font-size: 26px; }
        .reader-body article h2 { font-size: 21px; }
        .reader-body article a { color: var(--accent); }
        .reader-body article pre { padding: 16px; overflow: auto; border-radius: 8px; background: var(--bg); }
        .reader-body article code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
        .reader-body article blockquote { margin-left: 0; padding: 4px 16px; border-left: 3px solid var(--line); color: var(--text-2); }
        .empty-state { padding: 48px 24px; color: var(--text-3); text-align: center; font-size: 13px; }
        /* Full screen：隐藏顶栏与原左侧两栏，正文和目录占满视口 */
        body.reader-fullscreen .topbar,
        body.reader-fullscreen .sidebar,
        body.reader-fullscreen .note-list-pane { display: none; }
        body.reader-fullscreen .workspace { height: 100vh; grid-template-columns: 240px minmax(0, 1fr); }
        /* Full screen：左侧显示当前文档的标题目录 */
        .toc-pane { display: none; min-width: 0; min-height: 0; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); }
        body.reader-fullscreen .toc-pane { display: flex; }
        .toc-heading { height: 56px; display: flex; flex: none; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--text-2); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
        .toc-back { flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text-3); cursor: pointer; }
        .toc-back:hover { color: var(--accent); background: var(--accent-soft); }
        .toc-list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 8px 32px; scrollbar-width: thin; scrollbar-color: #d3d6da transparent; }
        .toc-link { display: block; padding: 6px 12px; border-left: 2px solid var(--line); color: var(--text-2); font-size: 12px; line-height: 1.5; text-decoration: none; cursor: pointer; }
        .toc-link:hover { color: var(--accent); }
        .toc-link.active { border-left-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .toc-link.depth-2 { padding-left: 24px; }
        .toc-link.depth-3 { padding-left: 36px; }
        .toc-link.depth-4 { padding-left: 48px; font-size: 11px; }
        .toc-empty { padding: 12px; color: var(--text-3); font-size: 12px; }
        .reader-body article h1, .reader-body article h2, .reader-body article h3, .reader-body article h4 { scroll-margin-top: 72px; }
        .side-link:focus-visible, .note-item:focus-visible, .toc-back:focus-visible, .top-actions a:focus-visible, .toc-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .side-link, .note-item, .toc-back, .top-actions a { transition: background-color 140ms cubic-bezier(.22,1,.36,1), color 140ms cubic-bezier(.22,1,.36,1); }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-icon">AI</span><span>AI Dev Notes</span></div>
        <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search Notes" aria-label="Search Notes"></label>
        <div class="top-actions"><a href="https://github.com/Bruce-peng24/ai-dev-notes" target="_blank">GitHub</a></div>
    </header>
    <div class="workspace">
        <aside class="sidebar" aria-label="笔记导航">
            <div class="section-label">Group List</div>
            <nav id="group-list" aria-label="笔记分组"></nav>
            <div class="sidebar-bottom"><a class="side-link" id="fullscreen-read" href="#" title="Full screen"><span class="side-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></span><span>Full screen</span></a></div>
        </aside>
        <section class="note-list-pane" aria-label="笔记列表">
            <div class="list-heading"><strong id="list-title">Group All</strong><small id="note-count">加载中</small></div>
            <nav class="note-list" id="note-list"></nav>
        </section>
        <aside class="toc-pane" aria-label="文档目录">
            <div class="toc-heading">
                <button class="toc-back" id="toc-back" type="button" title="展开侧栏" aria-label="展开侧栏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
                <span>On this page</span>
            </div>
            <nav class="toc-list" id="toc-list"></nav>
        </aside>
        <main class="reader" aria-live="polite">
            <div class="reader-toolbar"><span id="reader-status">Notes / Group All</span><span class="toolbar-buttons"><a href="https://bruce-peng24.github.io/ai-dev-notes/">Refresh</a></span></div>
            <div class="reader-body" id="reader-body"><div class="empty-state">正在加载笔记…</div></div>
        </main>
    </div>
    <script>
        const noteList = document.getElementById('note-list');
        const reader = document.getElementById('reader-body');
        const readerPane = document.querySelector('.reader');
        const search = document.getElementById('search');
        const tocList = document.getElementById('toc-list');
        let pages = [];
        let tocHeadings = [];
        let tocLinks = [];
        let tocRafPending = false;
        let activePath = '';
        let activeGroup = 'all';

        // jsDelivr 只加速资源；入口 index.html 仍由 GitHub Pages 提供。
        // 本地预览（localhost / 直接打开文件）自动退回本地文件，不请求 CDN。
        const REPO = 'Bruce-peng24/ai-dev-notes';
        const BRANCH = 'main';
        const CDN_HOST = 'cdn.jsdelivr.net';
        const CDN_BASE = `https://${CDN_HOST}/gh/${REPO}@${BRANCH}`;
        const useCdn = location.protocol !== 'file:' && !['localhost', '127.0.0.1'].includes(location.hostname);
        // CDN 会忽略查询参数做缓存，但浏览器不会；按天换参数可绕开浏览器对图片的 7 天缓存。
        const browserBust = `?v=${new Date().toISOString().slice(0, 10)}`;

        marked.setOptions({ breaks: true, gfm: true });

        function pageGroup(path) {
            const segments = path.replace(/^\.\//, '').replace(/^docs\//, '').split('/');
            return segments.length > 1 ? segments[0] : '未分组';
        }

        function groupOf(page) {
            return page.group || pageGroup(page.path);
        }

        function groupLabel() {
            return activeGroup === 'all' ? 'Group All' : activeGroup;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
        }

        function groupSort(a, b) {
            if (a === '未分组') return 1;
            if (b === '未分组') return -1;
            return a.localeCompare(b, undefined, { numeric: true });
        }

        const GROUP_ICONS = {
            all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
            loose: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
            group: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>'
        };

        function renderGroups() {
            // 分组完全从文章路径推导，数据文件里不保存任何分组名
            const counted = [...new Set(pages.map(groupOf))]
                .map(name => ({ name, count: pages.filter(page => groupOf(page) === name).length }));
            counted.sort((a, b) => groupSort(a.name, b.name));
            const items = [
                { id: 'all', label: 'Group All', icon: 'all', count: pages.length },
                ...counted.map(({ name, count }) => ({ id: name, label: name, icon: name === '未分组' ? 'loose' : 'group', count }))
            ];
            document.getElementById('list-title').textContent = groupLabel();
            document.title = `${groupLabel()} · AI Dev Notes`;
            document.getElementById('group-list').innerHTML = items.map(group => `<a class="side-link group-link${activeGroup === group.id ? ' active' : ''}" href="#" data-group="${escapeHtml(group.id)}"><span class="side-icon">${GROUP_ICONS[group.icon]}</span><span>${escapeHtml(group.label)}</span><span class="group-count">${group.count}</span></a>`).join('');
        }

        function selectGroup(event) {
            const selectedLink = event.target.closest('.group-link');
            if (!selectedLink) return;
            event.preventDefault();
            activeGroup = selectedLink.dataset.group;
            renderGroups();
            renderList(search.value);
            const currentPage = pages.find(page => page.path === activePath);
            if (!currentPage || (activeGroup !== 'all' && groupOf(currentPage) !== activeGroup)) {
                const firstPage = pages.find(page => activeGroup === 'all' || groupOf(page) === activeGroup);
                if (firstPage) location.hash = encodeURIComponent(firstPage.path);
                else syncRoute();
            }
        }

        function renderList(query = '') {
            const filtered = pages.filter(page => {
                const matchesGroup = activeGroup === 'all' || groupOf(page) === activeGroup;
                const normalizedQuery = query.toLowerCase();
                return matchesGroup && (page.label.toLowerCase().includes(normalizedQuery) || page.path.toLowerCase().includes(normalizedQuery));
            });
            document.getElementById('note-count').textContent = `${filtered.length} notes`;
            noteList.innerHTML = filtered.length ? filtered.map(page => `
                <a class="note-item${page.path === activePath ? ' active' : ''}" href="#${encodeURIComponent(page.path)}">
                    <div class="note-title">${escapeHtml(page.label)}</div>
                    <div class="note-meta"><span class="note-path">${escapeHtml(page.path)}</span></div>
                </a>`).join('') : '<div class="empty-state">没有找到相关笔记</div>';
        }

        // 文档目录：从当前渲染出的标题生成，切换文章时重建
        function setReaderHtml(html) {
            readerPane.scrollTop = 0;
            reader.innerHTML = html;
            buildToc();
        }

        function buildToc() {
            tocHeadings = [...reader.querySelectorAll('article h1, article h2, article h3, article h4')];
            tocList.innerHTML = tocHeadings.length
                ? tocHeadings.map((heading, index) => {
                    heading.id = `toc-heading-${index}`;
                    const level = Number(heading.tagName.slice(1));
                    const text = heading.textContent.trim() || '(untitled)';
                    return `<a class="toc-link depth-${level}" href="#" data-index="${index}">${escapeHtml(text)}</a>`;
                }).join('')
                : '<div class="toc-empty">No headings in this note</div>';
            tocLinks = [...tocList.querySelectorAll('.toc-link')];
            updateTocActive();
        }

        function updateTocActive() {
            if (!tocHeadings.length) return;
            const readerTop = readerPane.getBoundingClientRect().top;
            let active = 0;
            tocHeadings.forEach((heading, index) => {
                if (heading.getBoundingClientRect().top - readerTop <= 80) active = index;
            });
            if (readerPane.scrollTop + readerPane.clientHeight >= readerPane.scrollHeight - 4) {
                active = tocHeadings.length - 1;
            }
            tocLinks.forEach((link, index) => link.classList.toggle('active', index === active));
        }

        // Markdown 的相对路径是按 .md 文件所在目录写的，但 marked 的输出会被插进站点
        // 根目录下的 index.html，浏览器会按 index.html 的位置解析相对路径，导致资源 404。
        // 插入 DOM 前先把相对地址按笔记文件所在目录重新解析。
        function resolveNoteUrls(html, pagePath) {
            const template = document.createElement('template');
            template.innerHTML = html;
            const noteDir = String(pagePath).replace(/\\/g, '/').split('/').slice(0, -1).join('/');
            const noteBase = new URL(noteDir ? `${noteDir}/` : '', document.baseURI);
            const siteRoot = new URL('.', document.baseURI);

            template.content.querySelectorAll('img[src], video[src], source[src], a[href]').forEach(el => {
                const attr = el.hasAttribute('src') ? 'src' : 'href';
                const value = el.getAttribute(attr);
                // 绝对地址、协议相对地址、站点根路径、纯 hash 都保持原样
                if (!value || /^(?:[a-z][a-z\d+.-]*:|\/\/|\/|#)/i.test(value)) return;

                const resolved = new URL(value, noteBase);

                // 站内图片/视频改走 CDN；按天换查询参数只影响浏览器缓存，不影响 CDN 缓存键
                if (useCdn && ['IMG', 'VIDEO', 'SOURCE'].includes(el.tagName)
                    && resolved.origin === siteRoot.origin
                    && resolved.pathname.startsWith(siteRoot.pathname)) {
                    let relative = resolved.pathname.slice(siteRoot.pathname.length);
                    try { relative = decodeURIComponent(relative); } catch (error) { /* 保留原始编码 */ }
                    el.setAttribute(attr, `${CDN_BASE}/${relative}${browserBust}`);
                    return;
                }

                // 站内指向其他笔记的相对链接转成 hash 路由，避免跳出当前这个静态站
                if (attr === 'href' && /\.md(?:[?#]|$)/i.test(value)
                    && resolved.origin === siteRoot.origin
                    && resolved.pathname.startsWith(siteRoot.pathname)) {
                    let notePath = resolved.pathname.slice(siteRoot.pathname.length);
                    try { notePath = decodeURIComponent(notePath); } catch (error) { /* 保留原始编码 */ }
                    el.setAttribute('href', `#${encodeURIComponent(notePath)}`);
                    return;
                }

                el.setAttribute(attr, resolved.href);
            });
            return template.innerHTML;
        }

        async function openPage(path) {
            const page = pages.find(item => item.path === path);
            if (!page) {
                activePath = '';
                document.getElementById('reader-status').textContent = `Notes / ${groupLabel()}`;
                setReaderHtml('<div class="empty-state">从左侧列表选择一篇笔记开始阅读</div>');
                renderList(search.value);
                return;
            }
            activePath = page.path;
            document.getElementById('reader-status').textContent = `Notes / ${groupLabel()} / ${page.label}`;
            setReaderHtml('<div class="empty-state">正在打开笔记…</div>');
            renderList(search.value);
            try {
                let response;
                if (useCdn) {
                    try {
                        // no-store：浏览器不缓存笔记正文，push 后由自动刷新工作流清 CDN 缓存即可生效
                        response = await fetch(`${CDN_BASE}/${encodeURI(page.path)}`, { cache: 'no-store' });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    } catch {
                        response = await fetch(`./${page.path}`);
                    }
                } else {
                    response = await fetch(`./${page.path}`);
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const markdown = await response.text();
                const rendered = marked.parse(markdown);
                setReaderHtml(`<article>${resolveNoteUrls(rendered, page.path)}</article>`);
            } catch {
                setReaderHtml(`<div class="empty-state">无法加载「${escapeHtml(page.label)}」，请确认文件存在并通过 Web 服务器打开。</div>`);
            }
        }

        function syncRoute() {
            openPage(decodeURIComponent(location.hash.slice(1)));
        }

        function normalizePage(item) {
            const pagePath = String(item.path || '').replace(/^\.\//, '').replace(/\\/g, '/');
            const fallback = pagePath.split('/').pop().replace(/\.md$/i, '');
            return {
                path: pagePath,
                label: String(item.label || fallback),
                group: item.group || pageGroup(pagePath)
            };
        }

        async function fetchPagesFromJsDelivr() {
            // data.jsdelivr.com 的响应默认带 1 年 max-age，no-store 让浏览器每次都重新拉取。
            const url = `https://data.jsdelivr.com/v1/packages/gh/${REPO}@${BRANCH}?structure=flat`;
            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) return null;
                const info = await response.json();
                const found = (info.files || [])
                    .filter(file => /^\/docs\/.*\.md$/i.test(file.name))
                    .map(file => normalizePage({ path: file.name.replace(/^\//, '') }));
                return found.length ? found : null;
            } catch {
                return null;
            }
        }

        async function fetchPagesFromGitHub() {
            // GitHub Pages 本身就是静态服务器，浏览器列不了目录，
            // 但可以直接调用 GitHub API 读取仓库文件树，实现运行时动态获取路径。
            // 仓库信息从当前 Pages 地址推导，不写死。
            const host = location.hostname;
            if (!host.endsWith('.github.io')) return null;

            const owner = host.slice(0, -'.github.io'.length);
            const segments = location.pathname.split('/').filter(Boolean);
            const repo = segments[0] && !segments[0].endsWith('.html')
                ? segments[0]
                : `${owner}.github.io`;

            try {
                const repoResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
                if (!repoResponse.ok) return null;
                const repoInfo = await repoResponse.json();
                const branch = repoInfo.default_branch || 'main';

                const treeResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
                if (!treeResponse.ok) return null;
                const treeInfo = await treeResponse.json();

                const found = (treeInfo.tree || [])
                    .filter(item => item.type === 'blob' && item.path.startsWith('docs/') && /\.md$/i.test(item.path))
                    .map(item => normalizePage({ path: item.path }));
                return found.length ? found : null;
            } catch {
                return null;
            }
        }

        async function fetchPagesFromDirectoryListing() {
            const queue = ['./docs/'];
            const found = [];
            const seen = new Set();

            while (queue.length && found.length < 200 && seen.size < 200) {
                const dir = queue.shift();
                if (seen.has(dir)) continue;
                seen.add(dir);

                try {
                    const response = await fetch(dir, { cache: 'no-store' });
                    if (!response.ok) continue;
                    const doc = new DOMParser().parseFromString(await response.text(), 'text/html');

                    for (const link of doc.querySelectorAll('a[href]')) {
                        let href = link.getAttribute('href');
                        if (!href || /^(?:[a-z]+:|\/|\?|#)/i.test(href)) continue;
                        href = href.split(/[?#]/)[0];
                        let decoded;
                        try { decoded = decodeURIComponent(href); } catch { decoded = href; }
                        if (decoded === '../' || decoded.includes('..')) continue;

                        const child = dir.replace(/\/?$/, '/') + decoded;
                        if (decoded.endsWith('/')) queue.push(child);
                        else if (/\.md$/i.test(decoded)) found.push(normalizePage({ path: child.replace(/^\.\//, '') }));
                    }
                } catch {
                    // 目录不可读时继续下一项
                }
            }
            return found.length ? found : null;
        }

        async function fetchPages() {
            // 线上优先走 jsDelivr 的目录数据，失败再回退 GitHub API；本地走目录索引
            if (useCdn) {
                const fromCdn = await fetchPagesFromJsDelivr();
                if (fromCdn) return fromCdn;

                const fromGitHub = await fetchPagesFromGitHub();
                if (fromGitHub) return fromGitHub;
            }

            const fromListing = await fetchPagesFromDirectoryListing();
            if (fromListing) return fromListing;

            throw new Error('无法获取笔记目录');
        }

        fetchPages()
            .then(loaded => {
                pages = loaded;
                renderGroups();
                renderList();
                syncRoute();
                if (!location.hash) location.hash = encodeURIComponent(pages[0].path);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('note-count').textContent = '加载失败';
                setReaderHtml('<div class="empty-state">无法加载笔记目录：请检查网络，并确认通过 Web 服务器打开此页面。</div>');
            });

        search.addEventListener('input', () => renderList(search.value));

        // 点击目录项平滑滚动到对应标题
        tocList.addEventListener('click', event => {
            const link = event.target.closest('.toc-link');
            if (!link) return;
            event.preventDefault();
            const heading = tocHeadings[Number(link.dataset.index)];
            if (!heading) return;
            tocLinks.forEach(item => item.classList.toggle('active', item === link));
            heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // 正文滚动时反向高亮当前所在章节
        readerPane.addEventListener('scroll', () => {
            if (tocRafPending || !tocHeadings.length) return;
            tocRafPending = true;
            requestAnimationFrame(() => {
                tocRafPending = false;
                updateTocActive();
            });
        }, { passive: true });

        document.getElementById('fullscreen-read').addEventListener('click', event => {
            event.preventDefault();
            document.body.classList.add('reader-fullscreen');
            requestAnimationFrame(updateTocActive);
        });
        document.getElementById('toc-back').addEventListener('click', () => {
            document.body.classList.remove('reader-fullscreen');
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && document.body.classList.contains('reader-fullscreen')) {
                document.body.classList.remove('reader-fullscreen');
            }
        });
        document.getElementById('group-list').addEventListener('click', selectGroup);
        window.addEventListener('hashchange', syncRoute);
    </script>
</body>
</html>
