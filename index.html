<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./styles.css">
    <script>
        // 在首屏渲染前确定主题，避免浅色闪一下
        try {
            document.documentElement.dataset.theme = localStorage.getItem('notes-theme')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (error) {
            document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.3.0/lib/marked.umd.js"></script>
    <title>AI Dev Notes</title>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-icon">AI</span><span>AI Dev Notes</span></div>
        <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search" aria-label="Search"></label>
        <div class="top-actions">
            <a href="https://github.com/Bruce-peng24/ai-dev-notes" target="_blank">GitHub</a>
            <button class="icon-toggle" id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
                <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="view-toggle" id="view-toggle" type="button">专注阅读</button>
        </div>
    </header>
    <div class="workspace">
        <aside class="sidebar" aria-label="笔记导航">
            <div class="section-label"><span>Notes</span><small id="note-count">加载中</small></div>
            <nav id="group-list" aria-label="笔记分组与文章"></nav>
        </aside>
        <main class="reader" aria-live="polite">
            <div class="reader-toolbar"><div class="breadcrumb" id="reader-status">Notes</div></div>
            <div class="reader-body" id="reader-body"><div class="empty-state">正在加载笔记…</div></div>
            <nav class="article-nav" id="article-nav" aria-label="上一篇下一篇"></nav>
        </main>
        <aside class="toc-pane" aria-label="文档目录">
            <div class="toc-heading"><span>On this page</span></div>
            <nav class="toc-list" id="toc-list"></nav>
        </aside>
    </div>
    <script src="./app.js"></script>
</body>
</html>
