<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.jsdelivr.net/npm/marked@18.3.0/lib/marked.umd.js"></script>
    <title>AI Dev Notes</title>
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-synthesis: none;
            --bg: #f6f7f8;
            --surface: #ffffff;
            --line: #e8eaed;
            --line-soft: #f0f1f2;
            --text: #2f3236;
            --text-2: #666c73;
            --text-3: #8a9097;
            --accent: #c9433b;
            --accent-soft: #fbf1f0;
        }
        * { box-sizing: border-box; }
        body { height: 100vh; min-width: 1024px; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
        button, input { font: inherit; }
        a { color: inherit; }
        .topbar { height: 56px; display: flex; align-items: center; gap: 28px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 8px; min-width: 200px; color: var(--text); font-size: 16px; font-weight: 600; }
        .brand-icon { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 6px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
        .search { width: min(420px, 42vw); height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 8px; color: var(--text-3); }
        .search svg { flex: none; }
        .search input { width: 100%; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
        .search:focus-within { border-color: var(--accent); background: var(--surface); }
        .top-actions { display: flex; align-items: center; gap: 16px; margin-left: auto; color: var(--text-2); font-size: 13px; }
        .top-actions a { text-decoration: none; }
        .view-toggle { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text-2); font-size: 12px; cursor: pointer; }
        .view-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .workspace { height: calc(100vh - 56px); display: grid; grid-template-columns: 264px minmax(0, 1fr) 224px; }
        .sidebar { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 8px; background: var(--surface); border-right: 1px solid var(--line); }
        .section-label { display: flex; justify-content: space-between; padding: 8px 12px 12px; color: var(--text-3); font-size: 12px; }
        .section-label small { font-size: 11px; font-variant-numeric: tabular-nums; }
        #group-list { flex: 1; min-height: 0; overflow-y: auto; }
        .tree-group { margin-bottom: 6px; }
        .tree-group-header { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; }
        .tree-group-header:hover { color: var(--accent); background: var(--accent-soft); }
        .tree-group-header.current { color: var(--text); }
        .tree-caret { flex: none; width: 15px; height: 15px; color: var(--text-3); transition: transform 140ms cubic-bezier(.22,1,.36,1); }
        .tree-group.collapsed .tree-caret { transform: rotate(-90deg); }
        .tree-group-header.current .tree-caret { color: var(--accent); }
        .tree-group.collapsed .tree-children { display: none; }
        .group-count { margin-left: auto; color: var(--text-3); font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; }
        .tree-children { padding: 2px 0 4px; }
        .tree-leaf { display: block; overflow: hidden; padding: 7px 10px 7px 30px; border-radius: 6px; color: var(--text-2); font-size: 13px; font-weight: 400; line-height: 1.5; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
        .tree-leaf:hover { color: var(--accent); background: var(--accent-soft); }
        .tree-leaf.active { color: var(--accent); font-weight: 600; background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
        .reader { min-width: 0; overflow: auto; background: var(--surface); }
        .reader-toolbar { position: sticky; z-index: 1; top: 0; height: 56px; display: flex; align-items: center; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--text-3); font-size: 12px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
        .breadcrumb span { overflow: hidden; text-overflow: ellipsis; }
        .crumb-sep { color: #c8ccd0; }
        .crumb-current { color: var(--text); font-weight: 500; }
        .reader-body { width: min(100% - 64px, 760px); margin: 0 auto; padding: 8px 0 64px; line-height: 1.85; overflow-wrap: anywhere; }
        .reader-body article { color: var(--text); font-size: 15px; }
        .reader-body article h1, .reader-body article h2, .reader-body article h3 { margin: 28px 0 12px; color: var(--text); font-weight: 600; line-height: 1.35; }
        .reader-body article h1 { font-size: 26px; }
        .reader-body article h2 { font-size: 21px; }
        .reader-body article a { color: var(--accent); }
        .reader-body article pre { padding: 16px; overflow: auto; border-radius: 8px; background: var(--bg); }
        .reader-body article code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
        .reader-body article blockquote { margin-left: 0; padding: 4px 16px; border-left: 3px solid var(--line); color: var(--text-2); }
        .reader-body article h1, .reader-body article h2, .reader-body article h3, .reader-body article h4 { position: relative; }
        .heading-anchor { margin-left: 8px; color: var(--text-3); font-weight: 400; text-decoration: none; opacity: 0; transition: opacity 140ms; }
        .reader-body article h1:hover .heading-anchor, .reader-body article h2:hover .heading-anchor, .reader-body article h3:hover .heading-anchor, .reader-body article h4:hover .heading-anchor { opacity: 1; }
        .heading-anchor:hover { color: var(--accent); }
        .article-nav { display: flex; justify-content: space-between; gap: 16px; width: min(100% - 64px, 760px); margin: 0 auto; padding: 24px 0 64px; border-top: 1px solid var(--line); }
        .pager-link { flex: 0 1 48%; min-width: 0; display: block; padding: 11px 16px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); text-decoration: none; transition: border-color 140ms cubic-bezier(.22,1,.36,1), background-color 140ms cubic-bezier(.22,1,.36,1); }
        .pager-link:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
        .pager-link.next { margin-left: auto; text-align: right; }
        .pager-link small { display: block; margin-bottom: 6px; color: var(--text-3); font-size: 11px; }
        .pager-link span { display: block; overflow: hidden; color: var(--accent); font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
        .empty-state { padding: 48px 24px; color: var(--text-3); text-align: center; font-size: 13px; }
        /* 专注阅读：收起左侧目录树，正文与本页目录占满宽度 */
        body.reader-fullscreen .sidebar { display: none; }
        body.reader-fullscreen .workspace { grid-template-columns: minmax(0, 1fr) 224px; }
        .toc-pane { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); }
        .toc-heading { height: 56px; display: flex; flex: none; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--text-2); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
        .toc-list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 8px 32px; scrollbar-width: thin; scrollbar-color: #d3d6da transparent; }
        .toc-link { display: block; padding: 6px 12px; border-left: 2px solid var(--line); color: var(--text-2); font-size: 12px; line-height: 1.5; text-decoration: none; cursor: pointer; }
        .toc-link:hover { color: var(--accent); }
        .toc-link.active { border-left-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
        .toc-link.depth-2 { padding-left: 20px; }
        .toc-link.depth-3 { padding-left: 28px; font-size: 11px; }
        .toc-link.depth-4 { padding-left: 36px; font-size: 11px; }
        .toc-empty { padding: 12px; color: var(--text-3); font-size: 12px; }
        .reader-body article h1, .reader-body article h2, .reader-body article h3, .reader-body article h4 { scroll-margin-top: 72px; }
        .tree-group-header:focus-visible, .tree-leaf:focus-visible, .top-actions a:focus-visible, .view-toggle:focus-visible, .toc-link:focus-visible, .pager-link:focus-visible, .heading-anchor:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .tree-leaf, .top-actions a, .view-toggle, .toc-link { transition: background-color 140ms cubic-bezier(.22,1,.36,1), color 140ms cubic-bezier(.22,1,.36,1); }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-icon">AI</span><span>AI Dev Notes</span></div>
        <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search" aria-label="Search"></label>
        <div class="top-actions"><a href="https://github.com/Bruce-peng24/ai-dev-notes" target="_blank">GitHub</a><button class="view-toggle" id="view-toggle" type="button">专注阅读</button></div>
    </header>
    <div class="workspace">
        <aside class="sidebar" aria-label="笔记导航">
            <div class="section-label"><span>Notes</span><small id="note-count">加载中</small></div>
            <nav id="group-list" aria-label="笔记分组与文章"></nav>
        </aside>
        <main class="reader" aria-live="polite">
            <div class="reader-toolbar"><div class="breadcrumb" id="reader-status">Notes</div></div>
            <div class="reader-body" id="reader-body"><div class="empty-state">正在加载笔记…</div></div>
            <nav class="article-nav" id="article-nav" aria-label="上一篇下一篇"></nav>
        </main>
        <aside class="toc-pane" aria-label="文档目录">
            <div class="toc-heading"><span>On this page</span></div>
            <nav class="toc-list" id="toc-list"></nav>
        </aside>
    </div>
    <script>
        const reader = document.getElementById('reader-body');
        const readerPane = document.querySelector('.reader');
        const search = document.getElementById('search');
        const tocList = document.getElementById('toc-list');
        const groupList = document.getElementById('group-list');
        let pages = [];
        let tocHeadings = [];
        let tocLinks = [];
        let tocRafPending = false;
        let activePath = '';
        const expandedGroups = new Set();

        // jsDelivr 只加速资源；入口 index.html 仍由 GitHub Pages 提供。
        // 本地预览（localhost / 直接打开文件）自动退回本地文件，不请求 CDN。
        const REPO = 'Bruce-peng24/ai-dev-notes';
        const BRANCH = 'main';
        const CDN_HOST = 'cdn.jsdelivr.net';
        const CDN_BASE = `https://${CDN_HOST}/gh/${REPO}@${BRANCH}`;
        const useCdn = location.protocol !== 'file:' && !['localhost', '127.0.0.1'].includes(location.hostname);
        // CDN 会忽略查询参数做缓存，但浏览器不会；按天换参数可绕开浏览器对图片的 7 天缓存。
        const browserBust = `?v=${new Date().toISOString().slice(0, 10)}`;

        marked.setOptions({ breaks: true, gfm: true });

        function pageGroup(path) {
            const segments = path.replace(/^\.\//, '').replace(/^docs\//, '').split('/');
            return segments.length > 1 ? segments[0] : '未分组';
        }

        function groupOf(page) {
            return page.group || pageGroup(page.path);
        }

        function groupLabel() {
            const current = pages.find(page => page.path === activePath);
            return current ? groupOf(current) : 'Notes';
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
        }

        function groupSort(a, b) {
            if (a === '未分组') return 1;
            if (b === '未分组') return -1;
            return a.localeCompare(b, undefined, { numeric: true });
        }

        const TREE_CARET = '<svg class="tree-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

        // 分组名完全由文章路径推导；树节点展开状态只在本次会话内保存
        function renderTree(query = '') {
            const normalizedQuery = query.trim().toLowerCase();
            const matched = pages.filter(page => !normalizedQuery
                || page.label.toLowerCase().includes(normalizedQuery)
                || page.path.toLowerCase().includes(normalizedQuery));
            const grouped = new Map();
            matched.forEach(page => {
                const name = groupOf(page);
                if (!grouped.has(name)) grouped.set(name, []);
                grouped.get(name).push(page);
            });
            const currentGroup = activePath ? groupLabel() : '';
            const html = [...grouped.keys()].sort(groupSort).map(name => {
                const items = grouped.get(name);
                const expanded = normalizedQuery ? true : expandedGroups.has(name);
                const leaves = items.map(page => `<a class="tree-leaf${page.path === activePath ? ' active' : ''}" href="#${encodeURIComponent(page.path)}" title="${escapeHtml(page.path)}">${escapeHtml(page.label)}</a>`).join('');
                return `<div class="tree-group${expanded ? '' : ' collapsed'}"><div class="tree-group-header${name === currentGroup ? ' current' : ''}" data-group="${escapeHtml(name)}" role="button" tabindex="0" aria-expanded="${expanded}">${TREE_CARET}<span>${escapeHtml(name)}</span><span class="group-count">${items.length}</span></div><div class="tree-children">${leaves}</div></div>`;
            }).join('');
            groupList.innerHTML = html || '<div class="empty-state">没有找到相关笔记</div>';
            document.getElementById('note-count').textContent = `${matched.length} notes`;
            document.title = `${activePath ? groupLabel() : 'All notes'} · AI Dev Notes`;
        }

        function toggleGroup(event) {
            const header = event.target.closest('.tree-group-header');
            if (!header) return;
            const name = header.dataset.group;
            if (expandedGroups.has(name)) expandedGroups.delete(name);
            else expandedGroups.add(name);
            renderTree(search.value);
        }

        function handleTreeKeydown(event) {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            const header = event.target.closest('.tree-group-header');
            if (!header) return;
            event.preventDefault();
            toggleGroup({ target: header });
        }

        // 文档目录：从当前渲染出的标题生成，切换文章时重建
        function setReaderHtml(html) {
            readerPane.scrollTop = 0;
            reader.innerHTML = html;
            buildToc();
        }

        function buildToc() {
            tocHeadings = [...reader.querySelectorAll('article h1, article h2, article h3, article h4')];
            tocList.innerHTML = tocHeadings.length
                ? tocHeadings.map((heading, index) => {
                    const text = heading.textContent.trim() || '(untitled)';
                    heading.id = `toc-heading-${index}`;
                    // 标题锚点只用于定位，不改 location.hash（hash 被文章路由占用）
                    const anchor = document.createElement('a');
                    anchor.className = 'heading-anchor';
                    anchor.href = '#';
                    anchor.textContent = '#';
                    anchor.title = '定位到本节';
                    heading.appendChild(anchor);
                    const level = Number(heading.tagName.slice(1));
                    return `<a class="toc-link depth-${level}" href="#" data-index="${index}">${escapeHtml(text)}</a>`;
                }).join('')
                : '<div class="toc-empty">No headings in this note</div>';
            tocLinks = [...tocList.querySelectorAll('.toc-link')];
            updateTocActive();
        }

        function updateTocActive() {
            if (!tocHeadings.length) return;
            const readerTop = readerPane.getBoundingClientRect().top;
            let active = 0;
            tocHeadings.forEach((heading, index) => {
                if (heading.getBoundingClientRect().top - readerTop <= 80) active = index;
            });
            if (readerPane.scrollTop + readerPane.clientHeight >= readerPane.scrollHeight - 4) {
                active = tocHeadings.length - 1;
            }
            tocLinks.forEach((link, index) => link.classList.toggle('active', index === active));
        }

        // Markdown 的相对路径是按 .md 文件所在目录写的，但 marked 的输出会被插进站点
        // 根目录下的 index.html，浏览器会按 index.html 的位置解析相对路径，导致资源 404。
        // 插入 DOM 前先把相对地址按笔记文件所在目录重新解析。
        function resolveNoteUrls(html, pagePath) {
            const template = document.createElement('template');
            template.innerHTML = html;
            const noteDir = String(pagePath).replace(/\\/g, '/').split('/').slice(0, -1).join('/');
            const noteBase = new URL(noteDir ? `${noteDir}/` : '', document.baseURI);
            const siteRoot = new URL('.', document.baseURI);

            template.content.querySelectorAll('img[src], video[src], source[src], a[href]').forEach(el => {
                const attr = el.hasAttribute('src') ? 'src' : 'href';
                const value = el.getAttribute(attr);
                // 绝对地址、协议相对地址、站点根路径、纯 hash 都保持原样
                if (!value || /^(?:[a-z][a-z\d+.-]*:|\/\/|\/|#)/i.test(value)) return;

                const resolved = new URL(value, noteBase);

                // 站内图片/视频改走 CDN；按天换查询参数只影响浏览器缓存，不影响 CDN 缓存键
                if (useCdn && ['IMG', 'VIDEO', 'SOURCE'].includes(el.tagName)
                    && resolved.origin === siteRoot.origin
                    && resolved.pathname.startsWith(siteRoot.pathname)) {
                    let relative = resolved.pathname.slice(siteRoot.pathname.length);
                    try { relative = decodeURIComponent(relative); } catch (error) { /* 保留原始编码 */ }
                    el.setAttribute(attr, `${CDN_BASE}/${relative}${browserBust}`);
                    return;
                }

                // 站内指向其他笔记的相对链接转成 hash 路由，避免跳出当前这个静态站
                if (attr === 'href' && /\.md(?:[?#]|$)/i.test(value)
                    && resolved.origin === siteRoot.origin
                    && resolved.pathname.startsWith(siteRoot.pathname)) {
                    let notePath = resolved.pathname.slice(siteRoot.pathname.length);
                    try { notePath = decodeURIComponent(notePath); } catch (error) { /* 保留原始编码 */ }
                    el.setAttribute('href', `#${encodeURIComponent(notePath)}`);
                    return;
                }

                el.setAttribute(attr, resolved.href);
            });
            return template.innerHTML;
        }

        function renderBreadcrumb(page) {
            const parts = ['<span>Notes</span>'];
            if (page) {
                parts.push('<span class="crumb-sep">/</span>');
                parts.push(`<span>${escapeHtml(groupOf(page))}</span>`);
                parts.push('<span class="crumb-sep">/</span>');
                parts.push(`<span class="crumb-current">${escapeHtml(page.label)}</span>`);
            }
            document.getElementById('reader-status').innerHTML = parts.join('');
        }

        function renderArticleNav(page) {
            const nav = document.getElementById('article-nav');
            if (!page) { nav.innerHTML = ''; return; }
            const siblings = pages.filter(item => groupOf(item) === groupOf(page));
            const list = siblings.length > 1 ? siblings : pages;
            const index = list.findIndex(item => item.path === page.path);
            const prev = index > 0 ? list[index - 1] : null;
            const next = index >= 0 && index < list.length - 1 ? list[index + 1] : null;
            const pager = (item, label, direction) => item
                ? `<a class="pager-link ${direction}" href="#${encodeURIComponent(item.path)}" aria-label="${label} ${escapeHtml(item.label)}"><small>${label}</small><span>${escapeHtml(item.label)}</span></a>`
                : '';
            nav.innerHTML = pager(prev, 'Previous page', 'prev') + pager(next, 'Next page', 'next');
        }

        async function openPage(path) {
            const page = pages.find(item => item.path === path);
            if (!page) {
                activePath = '';
                renderBreadcrumb(null);
                setReaderHtml('<div class="empty-state">从左侧目录选择一篇笔记开始阅读</div>');
                renderTree(search.value);
                renderArticleNav(null);
                return;
            }
            activePath = page.path;
            renderBreadcrumb(page);
            setReaderHtml('<div class="empty-state">正在打开笔记…</div>');
            renderTree(search.value);
            renderArticleNav(page);
            try {
                let response;
                if (useCdn) {
                    try {
                        // no-store：浏览器不缓存笔记正文，push 后由自动刷新工作流清 CDN 缓存即可生效
                        response = await fetch(`${CDN_BASE}/${encodeURI(page.path)}`, { cache: 'no-store' });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    } catch {
                        response = await fetch(`./${page.path}`);
                    }
                } else {
                    response = await fetch(`./${page.path}`);
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const markdown = await response.text();
                const rendered = marked.parse(markdown);
                setReaderHtml(`<article>${resolveNoteUrls(rendered, page.path)}</article>`);
            } catch {
                setReaderHtml(`<div class="empty-state">无法加载「${escapeHtml(page.label)}」，请确认文件存在并通过 Web 服务器打开。</div>`);
            }
        }

        function syncRoute() {
            openPage(decodeURIComponent(location.hash.slice(1)));
        }

        function normalizePage(item) {
            const pagePath = String(item.path || '').replace(/^\.\//, '').replace(/\\/g, '/');
            const fallback = pagePath.split('/').pop().replace(/\.md$/i, '');
            return {
                path: pagePath,
                label: String(item.label || fallback),
                group: item.group || pageGroup(pagePath)
            };
        }

        async function fetchPagesFromJsDelivr() {
            // data.jsdelivr.com 的响应默认带 1 年 max-age，no-store 让浏览器每次都重新拉取。
            const url = `https://data.jsdelivr.com/v1/packages/gh/${REPO}@${BRANCH}?structure=flat`;
            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) return null;
                const info = await response.json();
                const found = (info.files || [])
                    .filter(file => /^\/docs\/.*\.md$/i.test(file.name))
                    .map(file => normalizePage({ path: file.name.replace(/^\//, '') }));
                return found.length ? found : null;
            } catch {
                return null;
            }
        }

        async function fetchPagesFromGitHub() {
            // GitHub Pages 本身就是静态服务器，浏览器列不了目录，
            // 但可以直接调用 GitHub API 读取仓库文件树，实现运行时动态获取路径。
            // 仓库信息从当前 Pages 地址推导，不写死。
            const host = location.hostname;
            if (!host.endsWith('.github.io')) return null;

            const owner = host.slice(0, -'.github.io'.length);
            const segments = location.pathname.split('/').filter(Boolean);
            const repo = segments[0] && !segments[0].endsWith('.html')
                ? segments[0]
                : `${owner}.github.io`;

            try {
                const repoResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
                if (!repoResponse.ok) return null;
                const repoInfo = await repoResponse.json();
                const branch = repoInfo.default_branch || 'main';

                const treeResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
                if (!treeResponse.ok) return null;
                const treeInfo = await treeResponse.json();

                const found = (treeInfo.tree || [])
                    .filter(item => item.type === 'blob' && item.path.startsWith('docs/') && /\.md$/i.test(item.path))
                    .map(item => normalizePage({ path: item.path }));
                return found.length ? found : null;
            } catch {
                return null;
            }
        }

        async function fetchPagesFromDirectoryListing() {
            const queue = ['./docs/'];
            const found = [];
            const seen = new Set();

            while (queue.length && found.length < 200 && seen.size < 200) {
                const dir = queue.shift();
                if (seen.has(dir)) continue;
                seen.add(dir);

                try {
                    const response = await fetch(dir, { cache: 'no-store' });
                    if (!response.ok) continue;
                    const doc = new DOMParser().parseFromString(await response.text(), 'text/html');

                    for (const link of doc.querySelectorAll('a[href]')) {
                        let href = link.getAttribute('href');
                        if (!href || /^(?:[a-z]+:|\/|\?|#)/i.test(href)) continue;
                        href = href.split(/[?#]/)[0];
                        let decoded;
                        try { decoded = decodeURIComponent(href); } catch { decoded = href; }
                        if (decoded === '../' || decoded.includes('..')) continue;

                        const child = dir.replace(/\/?$/, '/') + decoded;
                        if (decoded.endsWith('/')) queue.push(child);
                        else if (/\.md$/i.test(decoded)) found.push(normalizePage({ path: child.replace(/^\.\//, '') }));
                    }
                } catch {
                    // 目录不可读时继续下一项
                }
            }
            return found.length ? found : null;
        }

        async function fetchPages() {
            // 线上优先走 jsDelivr 的目录数据，失败再回退 GitHub API；本地走目录索引
            if (useCdn) {
                const fromCdn = await fetchPagesFromJsDelivr();
                if (fromCdn) return fromCdn;

                const fromGitHub = await fetchPagesFromGitHub();
                if (fromGitHub) return fromGitHub;
            }

            const fromListing = await fetchPagesFromDirectoryListing();
            if (fromListing) return fromListing;

            throw new Error('无法获取笔记目录');
        }

        fetchPages()
            .then(loaded => {
                pages = loaded;
                pages.forEach(page => expandedGroups.add(groupOf(page)));
                renderTree(search.value);
                syncRoute();
                if (!location.hash) location.hash = encodeURIComponent(pages[0].path);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('note-count').textContent = '加载失败';
                setReaderHtml('<div class="empty-state">无法加载笔记目录：请检查网络，并确认通过 Web 服务器打开此页面。</div>');
            });

        search.addEventListener('input', () => renderTree(search.value));
        groupList.addEventListener('click', toggleGroup);
        groupList.addEventListener('keydown', handleTreeKeydown);

        // 点击目录项平滑滚动到对应标题
        tocList.addEventListener('click', event => {
            const link = event.target.closest('.toc-link');
            if (!link) return;
            event.preventDefault();
            const heading = tocHeadings[Number(link.dataset.index)];
            if (!heading) return;
            tocLinks.forEach(item => item.classList.toggle('active', item === link));
            heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // 标题旁的 # 只做定位，不能改 hash：hash 被文章路由占用
        reader.addEventListener('click', event => {
            const anchor = event.target.closest('.heading-anchor');
            if (!anchor) return;
            event.preventDefault();
            const heading = anchor.closest('h1, h2, h3, h4');
            if (heading) heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // 正文滚动时反向高亮当前所在章节
        readerPane.addEventListener('scroll', () => {
            if (tocRafPending || !tocHeadings.length) return;
            tocRafPending = true;
            requestAnimationFrame(() => {
                tocRafPending = false;
                updateTocActive();
            });
        }, { passive: true });

        const viewToggle = document.getElementById('view-toggle');
        function setFocusMode(on) {
            document.body.classList.toggle('reader-fullscreen', on);
            viewToggle.textContent = on ? '退出专注' : '专注阅读';
            requestAnimationFrame(updateTocActive);
        }
        viewToggle.addEventListener('click', () => setFocusMode(!document.body.classList.contains('reader-fullscreen')));
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && document.body.classList.contains('reader-fullscreen')) setFocusMode(false);
        });
        window.addEventListener('hashchange', syncRoute);
    </script>
</body>
</html>
